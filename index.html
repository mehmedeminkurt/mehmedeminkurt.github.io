<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5f2">
    <meta name="description" content="Mehmed Emin Kurt'un kişisel CV ve profil sitesi.">
    <title>Mehmed Emin Kurt | Kişisel CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f5f2;
        --ink: #17211d;
        --muted: #68736d;
        --line: #d8ded9;
        --green: #245d45;
        --lime: #d4f06b;
        --white: #fff;
        font-family: "DM Sans", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(#c9d0ca 0.65px, transparent 0.65px);
        background-size: 15px 15px;
      }

      a { color: inherit; }

      .page {
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        padding: 0 clamp(24px, 7vw, 104px);
      }

      .topbar, footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .topbar {
        min-height: 88px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }

      .wordmark {
        font-family: "Space Grotesk", sans-serif;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }

      .availability {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
      }

      .availability::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #79a94d;
        content: "";
      }

      main {
        display: grid;
        width: min(100%, 1080px);
        flex: 1;
        grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
        align-items: center;
        gap: clamp(48px, 10vw, 144px);
        margin: 0 auto;
        padding: 72px 0 88px;
      }

      .intro { animation: arrive 650ms ease-out both; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 24px;
        color: var(--green);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 22px;
        height: 2px;
        background: var(--green);
        content: "";
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(48px, 7vw, 88px);
        font-weight: 600;
        line-height: 0.99;
      }

      .lead {
        max-width: 440px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.7;
      }

      .profile-link {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        gap: 12px;
        margin-top: 34px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--white);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .profile-link:hover, .profile-link:focus-visible {
        background: var(--lime);
        color: var(--ink);
      }

      .profile-link svg { width: 17px; height: 17px; }

      .profile {
        position: relative;
        width: min(100%, 330px);
        justify-self: end;
        animation: arrive 650ms 120ms ease-out both;
      }

      .portrait-frame {
        position: relative;
        aspect-ratio: 4 / 5;
        padding: 12px;
        border: 1px solid var(--line);
        background: var(--white);
      }

      .portrait-frame::after {
        position: absolute;
        z-index: -1;
        right: -15px;
        bottom: -15px;
        width: 45%;
        height: 45%;
        background: var(--lime);
        content: "";
      }

      .portrait-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #e5e9e5;
      }

      .profile-note {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-top: 28px;
      }

      .note-mark {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        place-items: center;
        background: var(--lime);
        font-family: "Space Grotesk", sans-serif;
        font-size: 14px;
        font-weight: 700;
      }

      .profile-note p {
        margin: 1px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      footer {
        min-height: 72px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      footer a { text-decoration-thickness: 1px; text-underline-offset: 3px; }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 700px) {
        .page { padding: 0 22px; }
        .topbar { min-height: 72px; }
        main {
          grid-template-columns: 1fr;
          gap: 56px;
          padding: 64px 0 72px;
        }
        h1 { font-size: clamp(48px, 13vw, 72px); }
        .lead { font-size: 16px; }
        .profile { width: min(76%, 300px); justify-self: start; margin-left: 8px; }
        footer { gap: 16px; font-size: 11px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="Ana sayfa">MEK.</a>
        <span class="availability">Kişisel CV sitesi</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="name">
          <p class="eyebrow">Merhaba, ben</p>
          <h1 id="name">Mehmed<br>Emin Kurt.</h1>
          <p class="lead">CV bilgilerim yakında burada olacak. Deneyim, eğitim ve çalışmalarımı bu sayfada paylaşacağım.</p>
          <a class="profile-link" href="https://github.com/mehmedeminkurt" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.23-1.65-1.23-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.2 3.26.92.1-.72.39-1.2.71-1.47-2.47-.28-5.07-1.24-5.07-5.51 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.43.11-2.97 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.12-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.69.12 2.97.71.78 1.14 1.78 1.14 3 0 4.28-2.6 5.23-5.08 5.5.4.35.76 1.03.76 2.08V22c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
            GitHub profilim
          </a>
        </section>

        <aside class="profile" aria-label="Profil fotoğrafı ve bilgi">
          <div class="portrait-frame">
            <img src="https://github.com/mehmedeminkurt.png" alt="Mehmed Emin Kurt'un profil fotoğrafı">
          </div>
          <div class="profile-note">
            <span class="note-mark" aria-hidden="true">01</span>
            <p>Profil ve özgeçmiş bilgileri güncellendikçe bu sayfa da yenilenecek.</p>
          </div>
        </aside>
      </main>

      <footer>
        <span>© <span id="year">2026</span> Mehmed Emin Kurt</span>
        <a href="https://github.com/mehmedeminkurt" target="_blank" rel="noopener noreferrer">GitHub'da görüntüle ↗</a>
      </footer>
    </div>
  </body>
</html>
